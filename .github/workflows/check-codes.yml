name: Kingshot Gift Code Check

on:
  schedule:
    # Runs at 00:00 and 12:00 UTC = 05:00 and 17:00 Pakistan time (PKT, UTC+5)
   # - cron: "0 0 * * *"
   # - cron: "0 12 * * *"
  workflow_dispatch: {}  # lets you trigger a manual run from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit seen_codes.json back

jobs:
  check-and-redeem:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run redeemer
        env:
          PLAYER_FID: ${{ secrets.PLAYER_FID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REDEEM_SALT: ${{ secrets.REDEEM_SALT }}
        run: python main.py

      - name: Commit updated seen_codes.json (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_codes.json
          git diff --cached --quiet || git commit -m "Update seen gift codes [skip ci]"
          git push
